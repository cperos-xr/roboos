# Builds the CYD screen firmware on every firmware change. Flash cyd_dashboard.ino.merged.bin at 0x0 (README).
name: firmware
on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Core and libraries (the versions verified on real screens)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib install LovyanGFX@1.2.7 ArduinoJson@7.4.1
      - name: CYD (ESP32-2432S028R)
        run: arduino-cli compile -b esp32:esp32:esp32:PartitionScheme=huge_app --output-dir out/cyd firmware/cyd_dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: cyd-firmware
          path: out/cyd/*.bin
