# RoboOS compiles, and every built-in app (and a sample installed app) draws without a screen.
name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -q fonts-dejavu-core
      - run: pip install -q Pillow numpy pyserial requests
      - name: Python compiles
        run: python -m compileall -q roboos tools
      - name: Every app draws (headless)
        run: python tools/smoke_test.py
